        <text x="138" y="453" fill="#d7cecf" font-family="Arial, sans-serif" font-size="11" font-weight="600">Sana Mirza</text>
        <text x="138" y="470" fill="#6c6163" font-family="Arial, sans-serif" font-size="9">Let's catch up tomorrow?</text>
        <text x="296" y="452" text-anchor="end" fill="#5b5152" font-family="monospace" font-size="7">38M</text>
      </g>

      <g>
        <rect x="76" y="499" width="248" height="61" rx="12" fill="#ffffff" fill-opacity="0.018"/>
        <circle cx="108" cy="529" r="19" fill="#1c1719"/>
        <text x="100" y="534" fill="#bfa8ab" font-family="Arial, sans-serif" font-size="10" font-weight="700">DP</text>
        <text x="138" y="524" fill="#d7cecf" font-family="Arial, sans-serif" font-size="11" font-weight="600">Dev Patel</text>
        <text x="138" y="541" fill="#6c6163" font-family="Arial, sans-serif" font-size="9">That's a clean solution.</text>
        <text x="296" y="523" text-anchor="end" fill="#5b5152" font-family="monospace" font-size="7">1H</text>
