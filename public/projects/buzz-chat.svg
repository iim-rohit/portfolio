<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Buzz Chat dark red interface preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160c0e"/>
      <stop offset="0.5" stop-color="#0a0909"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.16" r="0.6">
      <stop offset="0" stop-color="#e01e37" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#7d0a18" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7d0a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141011"/>
      <stop offset="1" stop-color="#0e0b0c"/>
    </linearGradient>
    <linearGradient id="redBubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5365"/>
      <stop offset="1" stop-color="#a80f22"/>
    </linearGradient>
    <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5365" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff5365" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 L0 0 0 42" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <ellipse cx="930" cy="90" rx="420" ry="280" fill="url(#glow)"/>
  <ellipse cx="160" cy="770" rx="300" ry="200" fill="#e01e37" opacity="0.06" filter="url(#blur)"/>

  <!-- app window -->
  <g>
    <rect x="58" y="54" width="1084" height="692" rx="24" fill="url(#panel)" stroke="#ff5365" stroke-opacity="0.2"/>
    <rect x="58" y="54" width="1084" height="52" rx="24" fill="#171213"/>
    <rect x="58" y="88" width="1084" height="18" fill="#171213"/>
    <line x1="58" y1="106" x2="1142" y2="106" stroke="#ffffff" stroke-opacity="0.06"/>
    <circle cx="88" cy="80" r="5" fill="#ff5365"/>
    <circle cx="105" cy="80" r="5" fill="#6d5b5e"/>
    <circle cx="122" cy="80" r="5" fill="#3d3536"/>
    <rect x="430" y="67" width="338" height="26" rx="13" fill="#0e0c0c" stroke="#ffffff" stroke-opacity="0.05"/>
    <circle cx="450" cy="80" r="4" fill="#ff5365" fill-opacity="0.7"/>
    <text x="464" y="84" fill="#817678" font-family="monospace" font-size="10" letter-spacing="1.2">buzzchat.app / conversations</text>
    <rect x="1068" y="67" width="46" height="26" rx="13" fill="#e01e37" fill-opacity="0.14" stroke="#ff5365" stroke-opacity="0.24"/>
    <text x="1082" y="84" fill="#ff8a95" font-family="monospace" font-size="9" letter-spacing="1">LIVE</text>

    <!-- sidebar -->
    <g>
      <rect x="58" y="106" width="284" height="640" fill="#0d0a0b"/>
      <line x1="342" y1="106" x2="342" y2="746" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="88" y="150" fill="#f7f2f2" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="-1">buzz</text>
      <circle cx="165" cy="142" r="4" fill="#ff5365"/>
      <text x="88" y="172" fill="#6f6365" font-family="monospace" font-size="8" letter-spacing="2.2">PRIVATE CONVERSATIONS</text>

      <rect x="84" y="196" width="232" height="38" rx="10" fill="#151112" stroke="#ffffff" stroke-opacity="0.05"/>
