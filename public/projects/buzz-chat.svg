      <text x="378" y="145" fill="#ff9aa4" font-family="Arial, sans-serif" font-size="11" font-weight="700">AR</text>
      <text x="420" y="136" fill="#f7f2f2" font-family="Arial, sans-serif" font-size="13" font-weight="700">Ananya Rao</text>
      <text x="420" y="153" fill="#ff8a95" font-family="monospace" font-size="8" letter-spacing="0.5">● ONLINE</text>
      <circle cx="1050" cy="140" r="15" fill="#ffffff" fill-opacity="0.03"/>
      <path d="M1045 136 C1047 132 1053 132 1055 136" fill="none" stroke="#8b7f81" stroke-width="1.4"/>
      <path d="M1044 143 C1047 146 1053 146 1056 143" fill="none" stroke="#8b7f81" stroke-width="1.4"/>
      <circle cx="1088" cy="140" r="15" fill="#ffffff" fill-opacity="0.03"/>
      <circle cx="1086" cy="137" r="1.4" fill="#8b7f81"/>
      <circle cx="1091" cy="137" r="1.4" fill="#8b7f81"/>
      <circle cx="1086" cy="142" r="1.4" fill="#8b7f81"/>
      <circle cx="1091" cy="142" r="1.4" fill="#8b7f81"/>

      <rect x="490" y="196" width="118" height="22" rx="11" fill="#ffffff" fill-opacity="0.035"/>
      <text x="549" y="211" text-anchor="middle" fill="#6f6365" font-family="monospace" font-size="7.5" letter-spacing="1">TODAY · 10:42</text>

      <g>
        <circle cx="382" cy="255" r="14" fill="#2a171b"/>
        <text x="376" y="259" fill="#ff9aa4" font-family="Arial, sans-serif" font-size="8" font-weight="700">AR</text>
        <rect x="406" y="236" width="306" height="50" rx="14" fill="#1a1415" stroke="#ffffff" stroke-opacity="0.05"/>
        <text x="422" y="257" fill="#d7cecf" font-family="Arial, sans-serif" font-size="10.5">Morning! Did you get a chance to look at</text>
        <text x="422" y="273" fill="#d7cecf" font-family="Arial, sans-serif" font-size="10.5">the new conversation flow?</text>
        <text x="406" y="302" fill="#5d5354" font-family="monospace" font-size="7">10:44</text>
      </g>

      <g>
        <rect x="742" y="312" width="352" height="62" rx="14" fill="url(#redBubble)"/>
        <text x="760" y="334" fill="#fff" font-family="Arial, sans-serif" font-size="10.5">Yes — the empty states feel much clearer</text>
        <text x="760" y="351" fill="#fff" font-family="Arial, sans-serif" font-size="10.5">now. I pushed a small polish pass.</text>
        <text x="760" y="366" fill="#ffd6da" fill-opacity="0.75" font-family="monospace" font-size="7">10:46 · DELIVERED</text>
      </g>

      <g>
        <circle cx="382" cy="414" r="14" fill="#2a171b"/>
        <text x="376" y="418" fill="#ff9aa4" font-family="Arial, sans-serif" font-size="8" font-weight="700">AR</text>
        <rect x="406" y="394" width="266" height="49" rx="14" fill="#1a1415" stroke="#ffffff" stroke-opacity="0.05"/>
        <text x="422" y="415" fill="#d7cecf" font-family="Arial, sans-serif" font-size="10.5">Perfect. The team is going to love this.</text>
        <text x="422" y="431" fill="#d7cecf" font-family="Arial, sans-serif" font-size="10.5">Shipping it today?</text>
        <text x="406" y="459" fill="#5d5354" font-family="monospace" font-size="7">10:48</text>
      </g>

      <g>
        <rect x="694" y="470" width="400" height="56" rx="14" fill="url(#redBubble)"/>
        <text x="712" y="492" fill="#fff" font-family="Arial, sans-serif" font-size="10.5">That's the plan. One last check on mobile,</text>
        <text x="712" y="508" fill="#fff" font-family="Arial, sans-serif" font-size="10.5">then it's live. 🚀</text>
        <text x="712" y="521" fill="#ffd6da" fill-opacity="0.75" font-family="monospace" font-size="7">10:50 · SEEN</text>
      </g>

      <g>
        <rect x="406" y="550" width="132" height="30" rx="15" fill="#ffffff" fill-opacity="0.035"/>
        <text x="422" y="569" fill="#8b7f81" font-family="Arial, sans-serif" font-size="9">Typing<tspan fill="#ff8a95">...</tspan></text>
      </g>

      <!-- composer -->
      <rect x="370" y="650" width="744" height="58" rx="16" fill="#151112" stroke="#ffffff" stroke-opacity="0.07"/>
      <circle cx="400" cy="679" r="14" fill="#e01e37" fill-opacity="0.12"/>
      <path d="M395 679 L405 679 M400 674 L400 684" stroke="#ff8a95" stroke-width="1.5" stroke-linecap="round"/>
      <text x="430" y="683" fill="#6c6163" font-family="Arial, sans-serif" font-size="10.5">Write a message...</text>
      <rect x="1034" y="662" width="64" height="34" rx="10" fill="url(#redBubble)"/>
      <path d="M1052 679 L1080 679 M1072 672 L1080 679 L1072 686" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
