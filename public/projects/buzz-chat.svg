      <path d="M107 219 L113 225" stroke="#817678" stroke-width="1.5"/>
      <text x="124" y="219" fill="#665b5d" font-family="Arial, sans-serif" font-size="10">Search conversations</text>

      <text x="88" y="264" fill="#5d5354" font-family="monospace" font-size="8" letter-spacing="1.8">RECENT CHATS</text>

      <g>
        <rect x="76" y="280" width="248" height="67" rx="12" fill="#e01e37" fill-opacity="0.1"/>
        <rect x="76" y="280" width="3" height="67" rx="2" fill="#ff5365"/>
        <circle cx="108" cy="313" r="20" fill="#2a171b"/>
        <text x="100" y="318" fill="#ff9aa4" font-family="Arial, sans-serif" font-size="11" font-weight="700">AR</text>
        <text x="140" y="307" fill="#f7f2f2" font-family="Arial, sans-serif" font-size="12" font-weight="700">Ananya Rao</text>
        <text x="140" y="326" fill="#8b7f81" font-family="Arial, sans-serif" font-size="9">Finally, the design is live.</text>
        <text x="296" y="306" text-anchor="end" fill="#ff8a95" font-family="monospace" font-size="7">NOW</text>
        <circle cx="305" cy="322" r="8" fill="#e01e37"/>
        <text x="305" y="325" text-anchor="middle" fill="#fff" font-family="monospace" font-size="7">2</text>
      </g>

      <g>
        <rect x="76" y="357" width="248" height="61" rx="12" fill="#ffffff" fill-opacity="0.018"/>
        <circle cx="108" cy="387" r="19" fill="#20161a"/>
        <text x="100" y="392" fill="#bfa8ab" font-family="Arial, sans-serif" font-size="10" font-weight="700">KV</text>
        <text x="138" y="382" fill="#d7cecf" font-family="Arial, sans-serif" font-size="11" font-weight="600">Kabir Verma</text>
        <text x="138" y="399" fill="#6c6163" font-family="Arial, sans-serif" font-size="9">Sent the updated files.</text>
        <text x="296" y="381" text-anchor="end" fill="#5b5152" font-family="monospace" font-size="7">12M</text>
